services:
  beer-catalogue-api:
    build: .
    container_name: beer-catalogue-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      JWT_SECRET: change-me-docker-secret-key-for-local-development
      JWT_EXPIRATION_MINUTES: 60
      INIT_DEMO_DATA_ENABLED: "true"
      BEER_PICTURES_DIR: /app/storage/beer-pictures
      BEER_PICTURE_MAX_SIZE_BYTES: 1048576
